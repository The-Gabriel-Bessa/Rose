<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63"/>
      <stop offset="50%" style="stop-color:#d81b60"/>
      <stop offset="100%" style="stop-color:#9c27b0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#e91e63" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0a0a0f"/>
  
  <!-- Main rose circle with gradient -->
  <circle cx="256" cy="256" r="200" fill="url(#grad-rose)" filter="url(#glow)"/>
  
  <!-- Inner rose pattern -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Outer petals -->
    <path d="M0 -120 L30 -40 L120 -40 L50 10 L70 100 L0 50 L-70 100 L-50 10 L-120 -40 L-30 -40 Z" 
          fill="white" opacity="0.95"/>
    
    <!-- Inner star -->
    <path d="M0 -80 L20 -25 L80 -25 L35 5 L50 70 L0 35 L-50 70 L-35 5 L-80 -25 L-20 -25 Z" 
          fill="url(#grad-rose)" opacity="0.8"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="15" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Glow ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#grad-rose)" stroke-width="2" opacity="0.5"/>
  
  <!-- Outer decorative ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#grad-rose)" stroke-width="1" opacity="0.3"/>
</svg>
